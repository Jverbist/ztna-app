services:
  fastapi:
    build:
      context: ./app
    container_name: ztna-fastapi
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - ztna-net
    # Not exposed to the host directly - only reachable through the nginx proxy.
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: ztna-nginx
    restart: unless-stopped
    depends_on:
      - fastapi
    ports:
      - "8880:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - ztna-net

networks:
  ztna-net:
    driver: bridge
